name: build-apk
on: push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon
        
      - name: Zip APK & Source
        run: |
          mkdir final_zip
          cp app/build/outputs/apk/debug/app-debug.apk final_zip/FF_Vision.apk
          rsync -av --exclude 'build/' --exclude '.gradle/' --exclude '.env' --exclude '.git/' ./ final_zip/source/
          cd final_zip && zip -r FF_Vision_Pack.zip .
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ff-vision-package
          path: final_zip/FF_Vision_Pack.zip
